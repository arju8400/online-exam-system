name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t online-exam-system:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d -p 3000:3000 --name exam online-exam-system:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:3000/health
          docker rm -f exam
